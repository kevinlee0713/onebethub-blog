<svg xmlns="http://www.w3.org/2000/svg" width="560" height="160" viewBox="0 0 560 160">
  <defs>
    <style>
      .word { font-family: 'Segoe UI', 'Arial', sans-serif; font-weight: 700; }
    </style>
  </defs>
  <!-- small geometric mark: hexagon node, echoes "data/network" feel of a trade-pub brand -->
  <g transform="translate(6,40)">
    <polygon points="40,0 78,20 78,60 40,80 2,60 2,20" fill="none" stroke="#22D3EE" stroke-width="6"/>
    <circle cx="40" cy="40" r="10" fill="#22D3EE"/>
  </g>
  <text x="104" y="103" class="word" font-size="72" fill="#F5F7FA">One<tspan fill="#22D3EE">Bet</tspan>Hub</text>
</svg>
